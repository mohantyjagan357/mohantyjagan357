    <text x="997" y="365" text-anchor="middle"
      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="11.5" letter-spacing="2.5" fill="#7dfff4" fill-opacity="0.82">GIT</text>

    <!-- ══════════════════════════════════════════════
         BOTTOM BAR
    ══════════════════════════════════════════════ -->
