<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="1400" height="420">
  <defs>

    <!-- Name gradient: teal → cyan → purple → pink -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1fffa0"/>
      <stop offset="28%"  stop-color="#7dfff4"/>
      <stop offset="62%"  stop-color="#b48aff"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#050c10"/>
      <stop offset="100%" stop-color="#060d13"/>
    </linearGradient>

    <!-- Name glow filter -->
    <filter id="nameGlow" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft dot glow -->
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Node network glow -->
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanlines -->
    <pattern id="scan" x="0" y="0" width="1400" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="3" width="1400" height="1" fill="#00ffaa" fill-opacity="0.015"/>
    </pattern>

    <!-- Dot grid -->
    <pattern id="dotgrid" x="0" y="0" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="0.9" fill="#7dfff4" fill-opacity="0.06"/>
    </pattern>

    <!-- Clip -->
    <clipPath id="rr">
      <rect x="0" y="0" width="1400" height="420" rx="10" ry="10"/>
    </clipPath>

    <!-- Animations -->
    <style>
      @keyframes namePulse {
        0%,100% { opacity:1; }
        50%      { opacity:0.90; }
      }
      @keyframes dotPulse {
        0%,100% { opacity:1; r:4.5; }
        50%      { opacity:0.6; r:6.5; }
      }
      @keyframes nodeBlink1 {
        0%,100% { opacity:0.18; }
        50%      { opacity:0.40; }
      }
      @keyframes nodeBlink2 {
        0%,100% { opacity:0.10; }
        50%      { opacity:0.26; }
      }
      @keyframes statusDot {
        0%,100% { opacity:1; }
        50%      { opacity:0.35; }
      }
      .name-text { animation: namePulse 3.5s ease-in-out infinite; }
      .gdot      { animation: dotPulse 2s ease-in-out infinite; }
      .n1        { animation: nodeBlink1 4.2s ease-in-out infinite; }
      .n2        { animation: nodeBlink2 5.5s ease-in-out infinite 1.2s; }
      .sdot      { animation: statusDot 1.6s ease-in-out infinite; }
    </style>

  </defs>

  <g clip-path="url(#rr)">

    <!-- ── Background fill ── -->
    <rect width="1400" height="420" fill="url(#bgGrad)"/>
    <rect width="1400" height="420" fill="url(#dotgrid)"/>

    <!-- ── Background network nodes top-left ── -->
    <g class="n1" filter="url(#nodeGlow)">
      <circle cx="92"  cy="54"  r="2.2" fill="#1fffa0"/>
      <circle cx="160" cy="36"  r="1.6" fill="#7dfff4"/>
      <circle cx="230" cy="70"  r="1.9" fill="#1fffa0"/>
      <circle cx="308" cy="46"  r="1.4" fill="#7dfff4"/>
      <circle cx="145" cy="115" r="1.7" fill="#1fffa0"/>
      <circle cx="258" cy="98"  r="1.3" fill="#7dfff4"/>
      <circle cx="195" cy="58"  r="1.1" fill="#a0ffe0"/>
    </g>
    <g class="n2">
      <line x1="92"  y1="54"  x2="160" y2="36"  stroke="#1fffa0" stroke-width="0.5" stroke-opacity="0.22"/>
      <line x1="160" y1="36"  x2="230" y2="70"  stroke="#7dfff4" stroke-width="0.5" stroke-opacity="0.18"/>
      <line x1="230" y1="70"  x2="308" y2="46"  stroke="#1fffa0" stroke-width="0.5" stroke-opacity="0.16"/>
      <line x1="145" y1="115" x2="230" y2="70"  stroke="#7dfff4" stroke-width="0.5" stroke-opacity="0.12"/>
      <line x1="145" y1="115" x2="258" y2="98"  stroke="#1fffa0" stroke-width="0.5" stroke-opacity="0.12"/>
      <line x1="92"  y1="54"  x2="195" y2="58"  stroke="#7dfff4" stroke-width="0.4" stroke-opacity="0.10"/>
    </g>

    <!-- ── Background network nodes top-right ── -->
    <g class="n1" filter="url(#nodeGlow)">
      <circle cx="1092" cy="50"  r="2.0" fill="#7dfff4"/>
      <circle cx="1166" cy="34"  r="1.6" fill="#1fffa0"/>
      <circle cx="1244" cy="64"  r="1.8" fill="#7dfff4"/>
      <circle cx="1316" cy="44"  r="1.4" fill="#1fffa0"/>
      <circle cx="1148" cy="112" r="1.6" fill="#7dfff4"/>
      <circle cx="1268" cy="92"  r="1.3" fill="#1fffa0"/>
      <circle cx="1205" cy="56"  r="1.1" fill="#a0ffe0"/>
    </g>
    <g class="n2">
      <line x1="1092" y1="50"  x2="1166" y2="34"  stroke="#7dfff4" stroke-width="0.5" stroke-opacity="0.20"/>
      <line x1="1166" y1="34"  x2="1244" y2="64"  stroke="#1fffa0" stroke-width="0.5" stroke-opacity="0.18"/>
      <line x1="1244" y1="64"  x2="1316" y2="44"  stroke="#7dfff4" stroke-width="0.5" stroke-opacity="0.16"/>
      <line x1="1148" y1="112" x2="1244" y2="64"  stroke="#1fffa0" stroke-width="0.5" stroke-opacity="0.12"/>
      <line x1="1148" y1="112" x2="1268" y2="92"  stroke="#7dfff4" stroke-width="0.5" stroke-opacity="0.12"/>
      <line x1="1092" y1="50"  x2="1205" y2="56"  stroke="#1fffa0" stroke-width="0.4" stroke-opacity="0.10"/>
    </g>

    <!-- ── Perspective grid bottom ── -->
    <line x1="700" y1="260" x2="0"    y2="420" stroke="#1fffa0" stroke-width="0.6" stroke-opacity="0.058"/>
    <line x1="700" y1="260" x2="116"  y2="420" stroke="#1fffa0" stroke-width="0.6" stroke-opacity="0.050"/>
    <line x1="700" y1="260" x2="233"  y2="420" stroke="#1fffa0" stroke-width="0.6" stroke-opacity="0.044"/>
    <line x1="700" y1="260" x2="350"  y2="420" stroke="#1fffa0" stroke-width="0.6" stroke-opacity="0.038"/>
    <line x1="700" y1="260" x2="466"  y2="420" stroke="#1fffa0" stroke-width="0.6" stroke-opacity="0.032"/>
    <line x1="700" y1="260" x2="583"  y2="420" stroke="#1fffa0" stroke-width="0.6" stroke-opacity="0.026"/>
    <line x1="700" y1="260" x2="700"  y2="420" stroke="#1fffa0" stroke-width="0.6" stroke-opacity="0.024"/>
    <line x1="700" y1="260" x2="816"  y2="420" stroke="#1fffa0" stroke-width="0.6" stroke-opacity="0.026"/>
    <line x1="700" y1="260" x2="933"  y2="420" stroke="#1fffa0" stroke-width="0.6" stroke-opacity="0.032"/>
    <line x1="700" y1="260" x2="1050" y2="420" stroke="#1fffa0" stroke-width="0.6" stroke-opacity="0.038"/>
    <line x1="700" y1="260" x2="1166" y2="420" stroke="#1fffa0" stroke-width="0.6" stroke-opacity="0.044"/>
    <line x1="700" y1="260" x2="1283" y2="420" stroke="#1fffa0" stroke-width="0.6" stroke-opacity="0.050"/>
    <line x1="700" y1="260" x2="1400" y2="420" stroke="#1fffa0" stroke-width="0.6" stroke-opacity="0.058"/>

    <line x1="420" y1="280" x2="980"  y2="280" stroke="#1fffa0" stroke-width="0.5" stroke-opacity="0.038"/>
    <line x1="280" y1="306" x2="1120" y2="306" stroke="#1fffa0" stroke-width="0.5" stroke-opacity="0.044"/>
    <line x1="140" y1="334" x2="1260" y2="334" stroke="#1fffa0" stroke-width="0.5" stroke-opacity="0.036"/>
    <line x1="0"   y1="364" x2="1400" y2="364" stroke="#1fffa0" stroke-width="0.5" stroke-opacity="0.028"/>

    <!-- Scanlines -->
    <rect width="1400" height="420" fill="url(#scan)"/>

    <!-- ══════════════════════════════════════════════
         HUD CORNER BRACKETS
    ══════════════════════════════════════════════ -->
    <polyline points="16,54 16,16 54,16"
      fill="none" stroke="#1fffa0" stroke-width="1.8" stroke-opacity="0.62" stroke-linecap="square"/>
    <polyline points="1346,16 1384,16 1384,54"
      fill="none" stroke="#1fffa0" stroke-width="1.8" stroke-opacity="0.62" stroke-linecap="square"/>
    <polyline points="16,366 16,404 54,404"
      fill="none" stroke="#1fffa0" stroke-width="1.8" stroke-opacity="0.62" stroke-linecap="square"/>
    <polyline points="1346,404 1384,404 1384,366"
      fill="none" stroke="#1fffa0" stroke-width="1.8" stroke-opacity="0.62" stroke-linecap="square"/>

    <!-- ══════════════════════════════════════════════
         PILL BADGES — 3 centered
    ══════════════════════════════════════════════ -->
    <!-- Badge 1: DEVOPS ENGINEER -->
    <rect x="322" y="46" width="238" height="34" rx="3" ry="3"
      fill="none" stroke="#1fffa0" stroke-width="1.3"/>
    <text x="441" y="68" text-anchor="middle"
      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="12" letter-spacing="2.2" fill="#1fffa0">◈  DEVOPS ENGINEER</text>

    <!-- Badge 2: JAVA DEVELOPER -->
    <rect x="578" y="46" width="218" height="34" rx="3" ry="3"
      fill="none" stroke="#7dfff4" stroke-width="1.3"/>
    <text x="687" y="68" text-anchor="middle"
      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="12" letter-spacing="2.2" fill="#7dfff4">○  JAVA DEVELOPER</text>

    <!-- Badge 3: CLOUD NATIVE -->
    <rect x="814" y="46" width="200" height="34" rx="3" ry="3"
      fill="none" stroke="#c084fc" stroke-width="1.3"/>
    <text x="914" y="68" text-anchor="middle"
      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="12" letter-spacing="2.2" fill="#c084fc">○  CLOUD NATIVE</text>

    <!-- ══════════════════════════════════════════════
         NAME
    ══════════════════════════════════════════════ -->
    <text x="700" y="180" text-anchor="middle" class="name-text"
      font-family="'Orbitron','Arial Black','Impact',sans-serif"
      font-size="90" font-weight="900" letter-spacing="8"
      fill="url(#nameGrad)" filter="url(#nameGlow)">SOUMYA MOHANTY</text>

    <!-- ══════════════════════════════════════════════
         ROLE LINE
    ══════════════════════════════════════════════ -->
    <text x="700" y="220" text-anchor="middle"
      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="12.5" letter-spacing="4.5"
      fill="#f97316" fill-opacity="0.65">// DEVOPS · JAVA · CLOUD · CI/CD · INFRASTRUCTURE //</text>

    <!-- ══════════════════════════════════════════════
         TAGLINE
    ══════════════════════════════════════════════ -->
    <text x="700" y="252" text-anchor="middle"
      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="13.5" letter-spacing="4"
      fill="#7dfff4" fill-opacity="0.72">CI/CD · CONTAINERS · CLOUD.</text>

    <!-- ══════════════════════════════════════════════
         DIVIDER
    ══════════════════════════════════════════════ -->
    <line x1="80"  y1="274" x2="688" y2="274"
      stroke="#1fffa0" stroke-width="0.8" stroke-opacity="0.25"/>
    <circle cx="700" cy="274" r="4.5" fill="#1fffa0" class="gdot" filter="url(#dotGlow)"/>
    <circle cx="700" cy="274" r="2.5" fill="#1fffa0"/>
    <line x1="712" y1="274" x2="1320" y2="274"
      stroke="#1fffa0" stroke-width="0.8" stroke-opacity="0.25"/>

    <!-- ══════════════════════════════════════════════
         TECH CHIPS ROW 1
         JAVA | SPRING BOOT | DOCKER | KUBERNETES | JENKINS
         Total w: 120+20+178+20+128+20+188+20+154 = 848
         start x = (1400-848)/2 = 276
    ══════════════════════════════════════════════ -->

    <rect x="276" y="294" width="120" height="32" rx="3"
      fill="none" stroke="#7dfff4" stroke-width="1" stroke-opacity="0.42"/>
    <text x="336" y="315" text-anchor="middle"
      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="11.5" letter-spacing="2.5" fill="#7dfff4" fill-opacity="0.82">JAVA</text>

    <rect x="416" y="294" width="178" height="32" rx="3"
      fill="none" stroke="#7dfff4" stroke-width="1" stroke-opacity="0.42"/>
    <text x="505" y="315" text-anchor="middle"
      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="11.5" letter-spacing="2.5" fill="#7dfff4" fill-opacity="0.82">SPRING BOOT</text>

    <rect x="614" y="294" width="128" height="32" rx="3"
      fill="none" stroke="#7dfff4" stroke-width="1" stroke-opacity="0.42"/>
    <text x="678" y="315" text-anchor="middle"
      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="11.5" letter-spacing="2.5" fill="#7dfff4" fill-opacity="0.82">DOCKER</text>

    <rect x="762" y="294" width="188" height="32" rx="3"
      fill="none" stroke="#7dfff4" stroke-width="1" stroke-opacity="0.42"/>
    <text x="856" y="315" text-anchor="middle"
      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="11.5" letter-spacing="2.5" fill="#7dfff4" fill-opacity="0.82">KUBERNETES</text>

    <rect x="970" y="294" width="154" height="32" rx="3"
      fill="none" stroke="#7dfff4" stroke-width="1" stroke-opacity="0.42"/>
    <text x="1047" y="315" text-anchor="middle"
      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="11.5" letter-spacing="2.5" fill="#7dfff4" fill-opacity="0.82">JENKINS</text>

    <!-- ══════════════════════════════════════════════
         TECH CHIPS ROW 2
         TERRAFORM | AWS | LINUX | ANSIBLE | GIT
         Total w: 162+20+100+20+112+20+140+20+90 = 684
         start x = (1400-684)/2 = 358
    ══════════════════════════════════════════════ -->

    <rect x="358" y="344" width="162" height="32" rx="3"
      fill="none" stroke="#7dfff4" stroke-width="1" stroke-opacity="0.42"/>
    <text x="439" y="365" text-anchor="middle"
      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="11.5" letter-spacing="2.5" fill="#7dfff4" fill-opacity="0.82">TERRAFORM</text>

    <rect x="540" y="344" width="100" height="32" rx="3"
      fill="none" stroke="#7dfff4" stroke-width="1" stroke-opacity="0.42"/>
    <text x="590" y="365" text-anchor="middle"
      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="11.5" letter-spacing="2.5" fill="#7dfff4" fill-opacity="0.82">AWS</text>

    <rect x="660" y="344" width="112" height="32" rx="3"
