      stroke="#1fffa0" stroke-width="0.7" stroke-opacity="0.13"/>

    <text x="66" y="410"
      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="11" letter-spacing="1.8" fill="#1fffa0" fill-opacity="0.42">v2.0.26 // github.com/soumya-mohanty</text>

    <!-- Status dot + ACTIVELY BUILDING centered -->
    <circle cx="622" cy="407" r="5.5" fill="#1fffa0" class="sdot" filter="url(#dotGlow)"/>
    <circle cx="622" cy="407" r="3"   fill="#1fffa0"/>
    <text x="636" y="412"
      font-family="'Share Tech Mono','Courier New',monospace"
