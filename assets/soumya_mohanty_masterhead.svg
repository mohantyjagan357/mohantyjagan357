      font-family="'Share Tech Mono','Courier New',monospace"
      font-size="11.5" letter-spacing="2.5" fill="#7dfff4" fill-opacity="0.82">LINUX</text>

    <rect x="792" y="344" width="140" height="32" rx="3"
      fill="none" stroke="#7dfff4" stroke-width="1" stroke-opacity="0.42"/>
    <text x="862" y="365" text-anchor="middle"
